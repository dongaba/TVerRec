name: Push to Docker Hub

on:
  push:
    branches: [dev, beta, master]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: docker.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: dongaba/tverrec

jobs:
  push_to_dockerhub:
    name: Push Docker image to Docker Hub (${{ github.ref_name }})
    runs-on: ubuntu-latest
    #runs-on: self-hosted
    steps:
      #Set Tag Name and Build Context per branch
      - name: Set Tag Name as Preparation
        id: prep
        run: |
          case "${GITHUB_REF_NAME}" in
            master) TAG="latest"; CONTEXT="./resources/docker" ;;
            beta)   TAG="beta";   CONTEXT="./resources/docker/beta" ;;
            dev)    TAG="dev";    CONTEXT="./resources/docker/dev" ;;
            *) echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
          echo "tag=${IMAGE_NAME}:${TAG}" >> $GITHUB_OUTPUT
          echo "context=${CONTEXT}" >> $GITHUB_OUTPUT

      #Check out
      - name: Check out the repo
        uses: actions/checkout@v6

      #Collect metadata
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          #images: dongaba/tverrec
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=${{ github.ref_name == 'master' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}

      #Build Preperation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      #Confirm available platforms
      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      #Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      #Build & Push
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.prep.outputs.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          tags: ${{ steps.prep.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}

      #Push README.md to Docker Hub (master only)
      - name: Docker Hub Description
        if: github.ref_name == 'master'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./README.md
