;;ダウンロード対象外番組
;;━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
;;----------------------------------------------------------------------
;;	「;」でコメントアウト
;;	ジャンル指定や放送局指定でダウンロードする際に、
;;	明らかにダウンロード不要な番組があれば番組名をここに列記する。
;;	tverrecがダウンロードを試みた際に、番組名がこのリストと一致した際は
;;	ダウンロード履歴に追加した上で、ダウンロードをスキップする。
;;	ダウンロード履歴に追加するのは次回以降に再チェックしないようにするため。
;;----------------------------------------------------------------------
;;	【正規表現で指定する】
;;	行頭が「regex:」の行は、それ以降を正規表現(.NET)として判定する。
;;	「regex:」で始まらない行は従来どおり(「*」はダウンロード時と不要ファイル削除時のみワイルドカード)。
;;
;;	・番組名の一部にマッチすれば対象外になる(部分一致)。大文字小文字は区別する
;;	・判定の対象は、リスト作成時がシリーズ名とエピソード名、ダウンロード時がファイル名と
;;	  シリーズ名、不要ファイル削除時がフォルダ名(シリーズ名)。ファイル名は拡張子(.mp4)を含む
;;	・番組名に ( ) [ ] { } . + * ? ^ $ | \ を含む場合は、前に \ を付ける(下の例を参照)
;;	・「regex:.*」のように、すべての番組にマッチする正規表現は書かない
;;	・正規表現が不正な行は、警告を表示してその行を無視する
;;	・下の例は先頭の「;;」とタブを外した行をコピーして、「;;」なしの行として書くと有効になる
;;----------------------------------------------------------------------
;;	■ 話数や種別ちがいを1行にまとめる
;;	  「第」または「最終」で始まる回だけを対象外にする
;;	regex:私の夫は冷凍庫に眠っている (第|最終)
;;
;;	■ 総集編・傑作選など再編集版を、番組を問わず対象外にする(全番組が対象になるので注意)
;;	regex:(総集編|傑作選|ダイジェスト)
;;
;;	■ 吹替版・生中継・ライブ配信を対象外にする
;;	regex:(吹替|吹き替え)版
;;	regex:(生中継|生配信|ライブ配信)
;;
;;	■ 全角と半角の記号ゆれ、スペースの有無、大文字小文字のちがいを吸収する
;;	  (?i)を付けると大文字小文字を区別しない。[！!]は全角か半角の「！」、「 ?」はスペースがあってもなくてもよい
;;	regex:(?i)BanG Dream[！!] ?Ave Mujica
;;	regex:(?i)super ?gt
;;
;;	■ シリーズ名の先頭で判定して、シリーズものをまとめて対象外にする
;;	regex:^(ウルトラマン|仮面ライダー|スーパー戦隊)
;;
;;	■ 番組名が他の番組名の一部になっているときに、その番組だけを対象にする
;;	  「^」は先頭、「( |$)」は「空白が続く」か「そこで終わり」。「サンプル番組スペシャル」にはマッチしない
;;	regex:^サンプル番組( |$)
;;
;;	■ 既に持っている範囲の話数だけを対象外にする(第1話から第10話)
;;	  [1-9]|10 と書くのは、第11話や第21話にマッチさせないため
;;	regex:^サンプル番組 第([1-9]|10)話
;;
;;	■ 番組名に記号を含むもの(記号の前に \ を付ける)
;;	regex:ウルトラマン80\(HDリマスター版\)
;;	regex:大奥～誕生\[有功･家光篇\]
;;	regex:Mr\.サンデー
;;	regex:A-Studio\+
;;----------------------------------------------------------------------
