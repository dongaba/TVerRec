<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<title>TVerRec Assistant</title>
		<link rel="stylesheet" href="../css/popup.css" />
	</head>

	<body>
		<div class="logo">
			<img src="../icon/TVerRec-Icon-48.png" alt="TVerRec" />
		</div>
		<div class="message">
			<div id="status">読み込み中...</div>
			<div id="uid"></div>
			<div id="token"></div>
			<div id="sid"></div>
		</div>
		<div class="button">
			<button type="button" class="action-button" id="open" hidden>TVerを開く</button>
			<button type="button" class="action-button" id="copy" hidden>user_settings.ps1用にコピー</button>
			<button type="button" class="action-button" id="refresh" hidden>再取得</button>
		</div>
		<script src="../js/popup.js"></script>
	</body>
</html>
